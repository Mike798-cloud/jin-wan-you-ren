<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b0e" />
  <title>今晚有人进过我家</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="titleScreen" class="title-screen">
      <div class="title-shade"></div>
      <div class="title-card">
        <p class="eyebrow">一个普通人的夜晚 · 22:48</p>
        <h1>今晚有人<br><span>进过我家</span></h1>
        <p class="lead">门锁没有坏。钥匙还在你手里。<br>但玄关那双拖鞋，早上绝不是这么放的。</p>
        <button id="startBtn" class="primary">开门回家</button>
        <button id="continueBtn" class="ghost hidden">继续上次调查</button>
        <p class="small">建议佩戴耳机。无跳脸惊吓，包含持续不安氛围。</p>
      </div>
    </section>

    <main id="game" class="game hidden" aria-live="polite">
      <header class="topbar">
        <div>
          <strong id="sceneName">玄关 / 厨房</strong>
          <span id="clock">22:48</span>
        </div>
        <div class="top-actions">
          <button data-panel="phone">手机</button>
          <button data-panel="notes">记事</button>
          <button data-panel="map">位置</button>
          <button data-panel="hint">提示</button>
          <button data-panel="settings">设置</button>
        </div>
      </header>

      <section class="play-area">
        <div id="sceneFrame" class="scene-frame" tabindex="0" aria-label="当前场景，可点击画面中的物体调查">
          <img id="sceneImage" alt="当前场景" draggable="false" />
          <div id="sceneTint" class="scene-tint"></div>
          <div id="hotspots" class="hotspots"></div>
          <div id="eventLayer" class="event-layer"></div>
          <div class="scene-caption">
            <p id="objective"></p>
            <span>画面中的可调查位置不会高亮。</span>
          </div>
        </div>
        <aside id="desktopSidebar" class="desktop-sidebar">
          <div class="sidebar-card">
            <span class="label">现在要做的事</span>
            <p id="objectiveSide"></p>
          </div>
          <div class="sidebar-card">
            <span class="label">你已经确认</span>
            <p><b id="clueCount">0</b> 条异常</p>
            <small id="dangerText">也许只是你记错了。</small>
          </div>
        </aside>
      </section>

      <nav id="quickNav" class="quick-nav" aria-label="房间导航"></nav>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button id="modalClose" class="modal-close" aria-label="关闭">×</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
