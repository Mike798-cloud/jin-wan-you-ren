<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b0e" />
  <meta name="description" content="《今晚有人进过我家》——普通独居者视角的二维写实恐怖悬疑网页游戏。" />
  <title>今晚有人进过我家</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="paywall.css" />
  <link rel="stylesheet" href="logic-fix.css?v=20260817i" />
</head>
<body>
  <div id="app">
    <section id="titleScreen" class="title-screen">
      <div class="title-shade"></div>
      <div class="title-card">
        <p class="eyebrow">一个普通人的夜晚 · 22:48</p>
        <h1>今晚有人<br><span>进过我家</span></h1>
        <p class="lead">门锁没有明显损坏。你正常打开了门。<br>屋里有几处细节，让你停下来重新看了一遍。</p>
        <div class="title-actions">
          <button id="startBtn" class="primary">开门回家</button>
          <button id="continueBtn" class="ghost hidden">继续上次调查</button>
          <button id="reviewBtn" class="ghost hidden">快速复盘（二周目）</button>
          <button id="endingArchiveBtn" class="ghost hidden">结局档案</button>
        </div>
        <p class="small">建议佩戴耳机 · 无跳脸惊吓 · 首次完整调查约 40–60 分钟</p>
      </div>
    </section>
    <main id="game" class="game hidden" aria-live="polite">
      <header class="topbar">
        <div class="scene-meta">
          <strong id="sceneName">玄关 / 厨房</strong>
          <span id="clock">22:48</span>
          <span id="stageLabel" class="stage-label">第一段 · 回家</span>
        </div>
        <div class="top-actions">
          <button data-panel="phone" aria-label="手机">手机</button>
          <button data-panel="notes" aria-label="记事">记事</button>
          <button data-panel="map" aria-label="位置">位置</button>
          <button data-panel="hint" aria-label="提示">提示</button>
          <button id="supportAuthorBtn" class="support-author-btn" type="button" aria-label="支持作者 1元">支持作者 1元</button>
          <button data-panel="settings" aria-label="设置">设置</button>
        </div>
      </header>
      <section class="play-area">
        <div id="sceneFrame" class="scene-frame" tabindex="0" aria-label="当前场景，可点击画面中的物体调查">
          <img id="sceneImage" alt="当前场景" draggable="false" />
          <div id="sceneTint" class="scene-tint"></div>
          <div class="film-grain"></div>
          <div id="hotspots" class="hotspots"></div>
          <div id="eventLayer" class="event-layer"></div>
          <div class="scene-caption">
            <p id="objective"></p>
            <span>画面中的可调查位置不会高亮。没有必要把每个角落都点一遍。</span>
          </div>
        </div>
        <aside id="desktopSidebar" class="desktop-sidebar">
          <div class="sidebar-card objective-card">
            <span class="label">现在要做的事</span>
            <p id="objectiveSide"></p>
          </div>
          <div class="sidebar-card evidence-card">
            <span class="label">已记录</span>
            <p><b id="clueCount">0</b> 条记录</p>
            <small id="dangerText">记录会自动保存在这台设备上。</small>
          </div>
          <div class="sidebar-card progress-card">
            <span class="label">今晚的调查</span>
            <div class="progress-track"><i id="progressBar"></i></div>
            <small id="progressText">刚刚回家</small>
          </div>
        </aside>
      </section>
      <nav id="quickNav" class="quick-nav" aria-label="房间导航"></nav>
    </main>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <button id="modalClose" class="modal-close" aria-label="关闭">×</button>
        <div id="modalContent"></div>
      </div>
    </div>
    <div id="toast" class="toast hidden" aria-live="polite"></div>
  </div>
  <script src="game.js"></script>
  <script src="paywall.js"></script>
  <script src="logic-fix.js?v=20260817i"></script>
</body>
</html>
